<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mixtape — SDK-test</title>
<!--
  A throwaway spike, deliberately outside the Angular app.

  It answers the three questions that decide whether the Web Playback SDK is
  worth migrating to, and it answers them on the phone rather than in theory:

    1. Does the SDK initialise at all on this handset and browser?
    2. Does audio actually start after activateElement() inside a tap?
    3. Does playback survive a screen lock or an app switch?

  It borrows the access token the app already stored on this origin, so there
  is no second login. Everything is reported on screen, because a phone has no
  console to read.
-->
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    padding: 16px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
    font: 15px/1.5 system-ui, -apple-system, sans-serif;
    background: #0d1517;
    color: #d7faf4;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { margin: 0 0 16px; opacity: 0.7; font-size: 13px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  button {
    flex: 1 1 auto;
    min-height: 48px;
    padding: 12px 14px;
    font: inherit;
    font-weight: 600;
    color: #06211e;
    background: #5fe3cd;
    border: 0;
    border-radius: 10px;
  }
  button:disabled { opacity: 0.35; }
  button.ghost { color: #d7faf4; background: transparent; border: 1px solid #39605e; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0 0 16px; font-size: 13px; }
  dt { opacity: 0.6; }
  dd { margin: 0; font-family: ui-monospace, monospace; word-break: break-all; }
  .ok { color: #5fe3cd; }
  .bad { color: #ff9b8a; }
  pre {
    margin: 0;
    padding: 10px;
    max-height: 40vh;
    overflow: auto;
    font-family: ui-monospace, monospace;
    font-size: 11px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-break: break-word;
    background: #000;
    border: 1px solid #39605e;
    border-radius: 8px;
  }
</style>
</head>
<body>

<h1>Mixtape — Web Playback SDK-test</h1>
<p class="sub">Los van de app. Tik de knoppen op volgorde.</p>

<div class="row">
  <button id="start">1 · Start speler</button>
  <button id="play" disabled>2 · Speel nummer</button>
</div>
<div class="row">
  <button id="toggle" class="ghost" disabled>Pauze / hervat</button>
  <button id="copy" class="ghost">Kopieer log</button>
</div>

<dl>
  <dt>Token</dt><dd id="s-token">—</dd>
  <dt>Scope</dt><dd id="s-scope">—</dd>
  <dt>Speler</dt><dd id="s-state">niet gestart</dd>
  <dt>Device id</dt><dd id="s-device">—</dd>
  <dt>Speelt</dt><dd id="s-playing">—</dd>
  <dt>Positie</dt><dd id="s-pos">—</dd>
  <dt>Laatste update</dt><dd id="s-seen">—</dd>
</dl>

<pre id="log"></pre>

<script>
(function () {
  'use strict';

  // Known-good track: No Diggity, 5:04. Same one the debug log used, so a
  // failure here cannot be blamed on an unavailable track.
  var TRACK = 'spotify:track:6MdqqkQ8sSC0WB4i8PyRuQ';
  var PREFIX = 'mixtape.';

  var logEl = document.getElementById('log');
  var lines = [];
  var player = null;
  var deviceId = null;

  function log(msg) {
    var at = Math.round(performance.now());
    var line = at + ' ' + msg;
    lines.push(line);
    if (lines.length > 200) lines.shift();
    logEl.textContent = lines.join('\n');
    logEl.scrollTop = logEl.scrollHeight;
  }

  function set(id, text, cls) {
    var el = document.getElementById(id);
    el.textContent = text;
    el.className = cls || '';
  }

  // The app stores its token on this same origin, so the test needs no login
  // of its own — but it also means the test is only valid on the deployed
  // site where that login lives.
  function read(key, fallback) {
    try {
      var raw = localStorage.getItem(PREFIX + key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch (e) {
      return fallback;
    }
  }

  var token = read('access', '');
  var scopes = String(read('scope', '')).split(' ').filter(Boolean);
  var expires = read('expires', 0);

  if (!token) {
    set('s-token', 'ontbreekt — log eerst in de app in', 'bad');
  } else if (Date.now() > expires) {
    set('s-token', 'verlopen — open de app even, dan ververst hij', 'bad');
  } else {
    set('s-token', 'ok, nog ' + Math.round((expires - Date.now()) / 60000) + ' min', 'ok');
  }

  // The SDK refuses to start without `streaming`, and a refreshed token keeps
  // the scopes of the original consent — so an old login silently lacks it.
  if (scopes.indexOf('streaming') === -1) {
    set('s-scope', 'streaming ONTBREEKT — verbind opnieuw in Instellingen', 'bad');
  } else {
    set('s-scope', 'streaming aanwezig', 'ok');
  }

  log('token=' + (token ? 'yes' : 'no') + ' streaming=' + (scopes.indexOf('streaming') !== -1));
  log('ua=' + navigator.userAgent);

  window.onSpotifyWebPlaybackSDKReady = function () {
    log('SDK script loaded');
    set('s-state', 'script geladen, nog niet verbonden');
    document.getElementById('start').disabled = false;
  };

  document.getElementById('start').addEventListener('click', function () {
    if (!token) { log('ERROR no token — sign in to the app first'); return; }
    if (player) { log('already created'); return; }

    log('creating player');
    player = new Spotify.Player({
      name: 'Mixtape SDK-test',
      getOAuthToken: function (cb) { cb(token); },
      volume: 0.8
    });

    // Each of these answers a different question, which is why none of them
    // are collapsed into one handler. account_error in particular is how a
    // Premium tier that excludes the SDK announces itself.
    player.addListener('initialization_error', function (e) {
      log('initialization_error: ' + e.message);
      set('s-state', 'init mislukt', 'bad');
    });
    player.addListener('authentication_error', function (e) {
      log('authentication_error: ' + e.message);
      set('s-state', 'token geweigerd', 'bad');
    });
    player.addListener('account_error', function (e) {
      log('account_error: ' + e.message + '  (Premium-tier ongeschikt?)');
      set('s-state', 'account geweigerd', 'bad');
    });
    player.addListener('playback_error', function (e) {
      log('playback_error: ' + e.message);
    });

    player.addListener('ready', function (e) {
      deviceId = e.device_id;
      log('READY device_id=' + deviceId);
      set('s-state', 'verbonden', 'ok');
      set('s-device', deviceId);
      document.getElementById('play').disabled = false;
      document.getElementById('toggle').disabled = false;
    });

    player.addListener('not_ready', function (e) {
      log('NOT READY device_id=' + e.device_id + ' — speler offline');
      set('s-state', 'offline', 'bad');
    });

    // The screen-lock test reads off this: if the position keeps climbing and
    // "laatste update" stays recent after unlocking, the tab survived.
    player.addListener('player_state_changed', function (state) {
      if (!state) { log('state=null (playback moved to another device)'); return; }
      set('s-playing', state.paused ? 'nee' : 'JA', state.paused ? '' : 'ok');
      set('s-pos', Math.round(state.position / 100) / 10 + ' s');
      set('s-seen', new Date().toLocaleTimeString('nl-NL'));
      log('state paused=' + state.paused + ' pos=' + state.position +
          ' track=' + (state.track_window.current_track || {}).name);
    });

    // Must happen inside this tap: mobile browsers block audio that was not
    // started by a gesture, and the actual play comes later over the network.
    if (player.activateElement) {
      player.activateElement().then(function () {
        log('activateElement ok');
      }).catch(function (err) {
        log('activateElement failed: ' + err);
      });
    } else {
      log('activateElement not present on this SDK build');
    }

    player.connect().then(function (ok) {
      log('connect() returned ' + ok);
    });
  });

  document.getElementById('play').addEventListener('click', function () {
    if (!deviceId) { log('no device id yet'); return; }
    log('PUT play -> ' + deviceId);
    // The SDK has no "play this uri" call; starting a specific track is still
    // a Web API command, just aimed at the in-page device.
    fetch('https://api.spotify.com/v1/me/player/play?device_id=' + encodeURIComponent(deviceId), {
      method: 'PUT',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ uris: [TRACK], position_ms: 0 })
    }).then(function (r) {
      log('play status=' + r.status + (r.status === 204 ? ' (accepted)' : ''));
      return r.status < 400 ? null : r.text();
    }).then(function (body) {
      if (body) log('play body=' + body);
    }).catch(function (err) {
      log('play fetch failed: ' + err);
    });
  });

  document.getElementById('toggle').addEventListener('click', function () {
    if (!player) return;
    player.togglePlay().then(function () { log('togglePlay sent'); });
  });

  document.getElementById('copy').addEventListener('click', function () {
    var text = lines.join('\n');
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(function () { log('copied'); });
    } else {
      var a = document.createElement('textarea');
      a.value = text;
      document.body.appendChild(a);
      a.select();
      try { document.execCommand('copy'); } catch (e) { /* manual copy */ }
      document.body.removeChild(a);
    }
  });

  // --- the screen-lock question -------------------------------------------
  //
  // `player_state_changed` only fires on changes, so a frozen tab and a
  // paused one look identical after the fact: both just stop logging. A
  // heartbeat makes the gap itself visible — the wall clock either kept
  // ticking across the lock or it did not — and the lifecycle events say
  // which of the two happened and exactly when.

  setInterval(function () {
    if (!player) return;
    player.getCurrentState().then(function (state) {
      var clock = new Date().toLocaleTimeString('nl-NL');
      if (!state) {
        log('beat ' + clock + ' state=null (this device is not playing)');
        return;
      }
      log('beat ' + clock + ' paused=' + state.paused + ' pos=' + state.position);
      document.getElementById('s-seen').textContent = clock;
    });
  }, 1000);

  document.addEventListener('visibilitychange', function () {
    log('visibility=' + document.visibilityState);
  });

  // Chrome's page lifecycle: `freeze` is precisely what a locked screen or a
  // backgrounded tab can trigger, and it is the event that would explain the
  // SDK device vanishing from the Connect list.
  document.addEventListener('freeze', function () { log('FREEZE — tab frozen by the browser'); });
  document.addEventListener('resume', function () { log('RESUME — tab thawed'); });
  window.addEventListener('pagehide', function (e) { log('pagehide persisted=' + e.persisted); });
  window.addEventListener('pageshow', function (e) { log('pageshow persisted=' + e.persisted); });

  document.getElementById('start').disabled = true;
  log('waiting for SDK script…');
})();
</script>
<script src="https://sdk.scdn.co/spotify-player.js"></script>

</body>
</html>
